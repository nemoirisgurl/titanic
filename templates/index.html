<!DOCTYPE html>
<html>

<head>
    <title> Titanic Survival Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>

<body>
    <div class="container">
        <h1> Titanic Survival Predictor</h1>
        <form action="/predict_form" method="post">
            <label for="Pclass">Passenger Class:</label>
            <select name="Pclass" required>
                <option value="1">1st Class</option>
                <option value="2">2nd Class</option>
                <option value="3">3rd Class</option>
            </select>
            <label for="Sex">Sex:</label>
            <select name="Sex" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <label for="Title">Title:</label>
            <select name="Title" required>
                <option value="Miss">Miss</option>
                <option value="Mrs">Mrs</option>
                <option value="Rare">Other</option>
            </select>
            <label for="Age">Age:</label>
            <input type="number" name="Age" min="0" value="0" required>
            <label for="SibSp">Number of Siblings/Spouses:</label>
            <input type="number" name="SibSp" min="0" value="0">
            <label for="Parch">Number of Parents/Children:</label>
            <input type="number" name="Parch" min="0" value="0">
            <label for="Fare">Fare:</label>
            <input type="number" name="Fare" min="0" step="0.01" value="0">
            <label for="Embarked">Boarding Port:</label>
            <select name="Embarked" required>
                <option value="S">Southampton</option>
                <option value="C">Cherbourg</option>
                <option value="Q">Queenstown</option>
            </select>
            <button type="submit">Predict Survival</button>
        </form>
    </div>
</body>

</html>
